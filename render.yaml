services:
  - type: web
    name: nmms-backend
    env: docker
    plan: free
    rootDir: backend
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://nmms-backend.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        generateValue: true
      - key: CLOUDINARY_URL
        generateValue: true
      - key: CHAPA_SECRET_KEY
        generateValue: true
      - key: APP_DEEP_LINK
        value: nmmsapp://payment-result
